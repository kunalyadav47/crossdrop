services:
  - type: web
    name: crossdrop-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
# Note: frontend is served by the backend service to ensure config.js is
# generated dynamically with the correct backend origin. Deploy only the
# `crossdrop-backend` service which serves both API and static client files.
